project_id = "bookglow-local"

[api]
enabled = true
port = 55431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 15

[db.pooler]
enabled = false
port = 55439
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 55433

[local_smtp]
enabled = true
port = 55434

[analytics]
enabled = false
port = 55437
backend = "postgres"

[auth]
enabled = true
site_url = "http://127.0.0.1:5174"
additional_redirect_urls = [
  "http://127.0.0.1:5174",
  "http://localhost:5173",
  "http://localhost:5174",
  "http://localhost:5173/auth/callback/merchant",
  "http://localhost:5174/auth/callback/customer",
  "http://localhost:5174/signup",
  "com.bookglow.merchant://auth/callback/merchant",
]

[storage]
enabled = true

[functions.chatbot-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.billing-admin]
verify_jwt = true

[functions.account-admin]
verify_jwt = true

[functions.invite-outlet-member]
verify_jwt = true

[functions.marketing-dispatch]
verify_jwt = true

[functions.google-business]
verify_jwt = false
